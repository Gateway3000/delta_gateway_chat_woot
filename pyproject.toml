[build-system]
requires = ["uv_build >= 0.9.11, <0.10.0"]
build-backend = "uv_build"

[project]
name = "multichannel-gateway"
version = "0.0.1"
description = "Channel Gateway for Helpline Platform"
requires-python = "==3.12.*"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "asyncpg==0.30.0",
    "fastapi==0.133.0",
    "uvicorn==0.35.0",
    "pydantic-settings==2.10.1",
    "pydantic[email]==2.11.9",
    "aiogram==3.25",
    "aiolimiter==1.2.0",
    "structlog==25.4.0",
    "pre-commit==4.5.0",
    "opentelemetry-distro==0.61b0",
    "opentelemetry-exporter-otlp==1.40.0",
    "opentelemetry-instrumentation-fastapi==0.61b0",
    "opentelemetry-sdk==1.40.0",
    "httpx>=0.28.1",
]

[project.entry-points."multichannel_gateway.channels"]
telegram = "channels.telegram_channel.tg_wiring:telegram_channel"
email = "channels.email_channel.email_wiring:email_channel"
imessage = "channels.imessage_channel:imessage_channel"


[project.optional-dependencies]
sentry = ["sentry-sdk[opentelemetry-otlp]==2.56.0"]

[dependency-groups]
dev = [
    "ruff==0.14.9",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "pytest-order==1.3.0",
    "coverage==7.13.0",
    "pytest-dotenv>=0.5.2",
    "pre-commit==4.5.0",
    "mypy==1.19.0",
    "httpx==0.28.1",
    "aioresponses==0.7.8",
    "pysentry-rs==0.4.3",
    "testcontainers[postgres]==4.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ras"
env_files = [".env.test"]
log_cli = true
log_cli_format = "%(message)s"
log_cli_level = "DEBUG"

[tool.mypy]
disable_error_code = "return"
ignore_missing_imports = true
exclude = "venv/"
mypy_path = "stubs"
cache_dir = "mypy_checks"

python_version = "3.12"
strict = true
allow_redefinition = false
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_return_any = false
warn_unused_ignores = false
show_error_context = true
show_column_numbers = true
error_summary = true
pretty = true
implicit_reexport = true

warn_redundant_casts = true
warn_unused_configs = true

disallow_subclassing_any = false

[tool.pysentry]
version = 1

[tool.pysentry.defaults]
fail_on = "critical"
scope = "all"
direct_only = false
no_ci_detect = false
display = "table"

[tool.pysentry.resolver]
type = "uv"

[tool.pysentry.ignore]
ids = []
while_no_fix = []

[tool.pysentry.maintenance]
enabled = true
forbid_archived = false
forbid_deprecated = false
forbid_quarantined = true
forbid_unmaintained = false
check_direct_only = false
cache_ttl = 1

[tool.pysentry.http]
timeout = 120
connect_timeout = 30
max_retries = 3
