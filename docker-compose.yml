volumes:
  pgmq:

services:
  app:
    image: channel-gateway:latest
    restart: unless-stopped
    container_name: gateway
    depends_on:
      - db
    env_file: .env

  db:
    image: "ghcr.io/pgmq/pg${POSTGRES_VERSION}-pgmq:${PGMQ_VERSION}"
    restart: unless-stopped
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgmq:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
