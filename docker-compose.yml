volumes:
  pgmq:
  signal-data:
  wa1_auth:
  simplex-data:

services:
  app:
    image: channel-gateway:latest
    restart: unless-stopped
    container_name: gateway
    depends_on:
      - db
      - signal-bridge
      - wa-sidecar-1
      - session-bridge
      - simplex-chat
    env_file: .env

  # signal-bridge fronts the Signal account: a small presage-based daemon that
  # speaks newline-delimited JSON over TCP. The gateway's Signal connector
  # connects to it in-network at signal-bridge:8080 (host/port in
  # SIGNAL_BOTS_CONFIG) — no port needs to be published to the host.
  #
  # Link the account once before first use (renders a QR / prints the URL):
  #   docker compose run --rm signal-bridge link
  # The linked session is persisted in the signal-data volume.
  signal-bridge:
    build:
      context: ./signal-bridge
    image: signal-bridge:latest
    restart: unless-stopped
    container_name: signal-bridge
    command: ["serve", "--listen", "0.0.0.0:8080"]
    # Published to the host so a gateway running outside this compose network
    # can reach it at host.docker.internal:8080 (the host set in
    # SIGNAL_BOTS_CONFIG). If the gateway shares this network, you can switch
    # the host to "signal-bridge" and drop this to `expose: ["8080"]`.
    ports:
      - "8080:8080"
    environment:
      SIGNAL_DB_PATH: /data/signal.db3
      SIGNAL_SERVERS: production
    volumes:
      - signal-data:/data

  # simplex-chat fronts the SimpleX bot: the official CLI run as a WebSocket
  # server, with a socat shim exposing its localhost-only port on the network.
  # The gateway's SimpleX connector connects to it in-network at
  # ws://simplex-chat:5225 (ws_url in SIMPLEX_CONFIG). The profile db lives in
  # the simplex-data volume.
  #
  # First-time setup (create the bot profile once, then Ctrl-D):
  #   docker compose run --rm --entrypoint simplex-chat simplex-chat -d /data/simplex
  # The connector auto-creates the bot address + enables auto-accept on connect;
  # the address is logged so you can share it for users to connect.
  simplex-chat:
    build:
      context: ./simplex-service
    image: simplex-chat:latest
    restart: unless-stopped
    container_name: simplex-chat
    # Published to the host so a gateway running outside this compose network
    # can reach it at ws://host.docker.internal:5225 (the ws_url in
    # SIMPLEX_CONFIG). If the gateway shares this network, switch ws_url to
    # ws://simplex-chat:5225 and change this to `expose: ["5225"]`.
    ports:
      - "5225:5225"
    volumes:
      - simplex-data:/data

  db:
    image: "ghcr.io/pgmq/pg${POSTGRES_VERSION}-pgmq:${PGMQ_VERSION}"
    restart: unless-stopped
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgmq:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ---------------- WhatsApp sidecar(s) ----------------
  wa-sidecar-1:
    build: ./sidecar
    image: wa-baileys-sidecar:latest
    container_name: wa-sidecar-1
    restart: unless-stopped
    environment:
      CONNECTOR_ID: wa1
      PORT: "3000"
      SELF_URL: http://wa-sidecar-1:3000
      GATEWAY_INGEST_URL: http://gateway:8000/ingest/incoming/whatsapp/wa1/webhook
      SIDECAR_TOKEN: ${WA_SIDECAR_TOKEN}
      INGEST_TOKEN: ${WA_INGEST_TOKEN}
      LOG_LEVEL: info
      # Set WA1_PAIR_NUMBER in .env (digits + country code, no '+') to log in
      # via pairing code instead of QR. Leave empty to use QR.
      PAIR_NUMBER: ${WA1_PAIR_NUMBER:-}
    volumes:
      - wa1_auth:/data/auth

  session-bridge:
    build:
      context: ./session
    image: session-bridge:latest
    restart: unless-stopped
    container_name: session-bridge
    environment:
      SESSION_MNEMONIC: ${SESSION_MNEMONIC}
      SESSION_WEBHOOK_URL: http://gateway:8000/ingest/incoming/session/session1/webhook
      HOST: 0.0.0.0
      PORT: "8080"
